schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
# Outlines the tech stack, directories, design patterns, and conventions.
context: |
  This project is a monorepo for "Anika Jewelry Landing Page / Platform", an e-commerce platform for high-quality jewelry. It consists of a customer-facing storefront, an admin panel, a Supabase backend database with Row-Level Security (RLS) policies, and Terraform infrastructure management.

  Monorepo Structure & Key Components:
    - `web`: The customer-facing storefront and admin dashboard application built using React 19, Vite, React Router DOM (v7), and Vanilla CSS. Features user signup, OTP login verification, storefront category display, product details, address booking, order histories, and administrative console (`web/src/admin`).
    - `supabase`: Local development setup containing database migrations, configuration, database triggers, seed data, and Edge Functions.
    - `terraform`: Infrastructure orchestration for provisioning AWS static sites (S3 + CloudFront) and Supabase resources.

  Tech Stack & Architecture:
    - Frontend: React 19 (functional components, routing via react-router-dom, state management via hooks)
    - Bundler: Vite
    - Styling: Vanilla CSS (modern aesthetics, custom gradients, micro-animations, typography: Cinzel, Cormorant Garamond, Inter)
    - Backend/Database: Supabase (PostgreSQL, row-level security enabled, automated profile creation triggers)
    - Infrastructure as Code: Terraform (modular configurations split by environment)

  Database & Security Conventions (Supabase):
    - Row-Level Security (RLS) MUST be enabled on all tables.
    - All select/read permissions for products and categories are open to the public.
    - Write access policies and user profiles are secured by checking `auth.uid() = user_id`.
    - Administrative tables and operations must check role permissions from `public.admin_users`.

  Project Workflows & Conventions:
    - Keep the codebase knowledge graph updated. Run `graphify update .` after modifying code.
    - Follow conventional commits for code changes.
    - Any changes made to `supabase` or `terraform` configurations MUST also inspect and update GitHub Actions workflows (e.g., `.github/workflows/deploy.yml`) for required updates.

# Per-artifact rules
# Add custom rules for specific artifacts generated by OpenSpec.
rules:
  proposal:
    - Keep proposals clear, concise, and focused on target outcomes.
    - Explicitly detail the impact on monorepo subprojects (`web`, `supabase`, `terraform`, and `.github/workflows`).
    - Outline database schema migrations or RLS policy additions.
    - Identify any new environment variable or secret requirements in local, production, and CI/CD (GitHub Actions).
  specs:
    - Include a descriptive visual layout and styling plan for UI additions.
    - Define frontend state structure and component API contracts.
    - Explicitly verify backend/schema changes and database trigger interactions.
  tasks:
    - Group tasks by component area: Frontend, Database/Supabase, or Infrastructure.
    - Break down tasks into small, incremental, verifiable steps.
    - Ensure every task group includes verification/testing steps.

