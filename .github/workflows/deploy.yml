name: CI/CD Infrastructure & Application Deployment

on:
  push:
    branches:
      - dev
      - main

permissions:
  id-token: write # Required for requesting the JWT for OIDC
  contents: read  # Required for actions/checkout

jobs:
  terraform:
    name: Infrastructure Provisioning
    runs-on: ubuntu-latest
    outputs:
      is_prod: ${{ steps.vars.outputs.is_prod }}
#      storefront_s3_bucket: ${{ steps.aws_outputs.outputs.storefront_s3_bucket }}
#      storefront_cf_dist: ${{ steps.aws_outputs.outputs.storefront_cf_dist }}
#      admin_s3_bucket: ${{ steps.aws_outputs.outputs.admin_s3_bucket }}
#      admin_cf_dist: ${{ steps.aws_outputs.outputs.admin_cf_dist }}
#      admin_url: ${{ steps.aws_outputs.outputs.admin_url }}
      supabase_url: ${{ steps.supabase_outputs.outputs.supabase_url }}
      supabase_anon_key: ${{ steps.supabase_outputs.outputs.supabase_anon_key }}
      supabase_ref: ${{ steps.supabase_outputs.outputs.supabase_ref }}
      supabase_region: ${{ steps.supabase_outputs.outputs.supabase_region }}
      supabase_db_url: ${{ steps.supabase_outputs.outputs.supabase_db_url }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Terraform Environment Variables
        id: vars
        run: |
          echo "is_prod=${{ github.ref_name == 'main' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name == 'main' }}" = "true" ]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "TF_WORKSPACE=anika-landing-page-prod" >> $GITHUB_ENV
            echo "DB_PASS=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "SITE_URL=https://www.anikajewelry.gideonjacob.in" >> $GITHUB_ENV
            echo "db_pass=${{ secrets.PROD_DB_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "TF_WORKSPACE=anika-landing-page-dev" >> $GITHUB_ENV
            echo "DB_PASS=AnikaDevSecureDbPass2026" >> $GITHUB_ENV
            echo "SITE_URL=https://dev.anikajewelry.gideonjacob.in" >> $GITHUB_ENV
            echo "db_pass=AnikaDevSecureDbPass2026" >> "$GITHUB_OUTPUT"
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAM_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="supabase_access_token=${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -var="supabase_organization_id=${{ secrets.SUPABASE_ORGANIZATION_ID }}" \
            -var="supabase_project_ref=${{ secrets.SUPABASE_PROJECT_REF }}" \
            -var="db_password=${{ env.DB_PASS }}" \
            -var="environment=${{ env.ENV_NAME }}" \
            -var="site_url=${{ env.SITE_URL }}"

#      - name: Export AWS Deployment Outputs
#        id: aws_outputs
#        working-directory: terraform
#        run: |
#          echo "storefront_s3_bucket=$(terraform output -raw storefront_s3_bucket)" >> "$GITHUB_OUTPUT"
#          echo "storefront_cf_dist=$(terraform output -raw storefront_cloudfront_id)" >> "$GITHUB_OUTPUT"
#          echo "admin_s3_bucket=$(terraform output -raw admin_s3_bucket)" >> "$GITHUB_OUTPUT"
#          echo "admin_cf_dist=$(terraform output -raw admin_cloudfront_id)" >> "$GITHUB_OUTPUT"
#          echo "admin_url=$(terraform output -raw admin_url)" >> "$GITHUB_OUTPUT"

      - name: Resolve Supabase API Credentials
        id: supabase_outputs
        working-directory: terraform
        run: |
          # Get all outputs in JSON format
          outputs=$(terraform output -json)
          
          # Parse values using jq
          db_url=$(echo "$outputs" | jq -r '.db_url.value // empty')
          anon_key=$(echo "$outputs" | jq -r '.anon_key.value // empty')
          project_url=$(echo "$outputs" | jq -r '.project_url.value // empty')
          project_id=$(echo "$outputs" | jq -r '.project_id.value // empty')
          supabase_region=$(echo "$outputs" | jq -r '.supabase_region.value // empty')
          
          # Debug output keys if db_url is empty
          if [ -z "$db_url" ]; then
            echo "ERROR: db_url is empty!" >&2
            echo "Available outputs in state:" >&2
            echo "$outputs" | jq 'keys' >&2
            exit 1
          fi
          
          echo "::add-mask::$db_url"
          echo "::add-mask::$anon_key"
          
          echo "supabase_url=$project_url" >> "$GITHUB_OUTPUT"
          echo "supabase_anon_key=$anon_key" >> "$GITHUB_OUTPUT"
          echo "supabase_ref=$project_id" >> "$GITHUB_OUTPUT"
          echo "supabase_region=$supabase_region" >> "$GITHUB_OUTPUT"
          echo "supabase_db_url=$db_url" >> "$GITHUB_OUTPUT"

  db_migration:
    name: Database Migrations
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Migrations to Remote DB
        run: |
          supabase db push --db-url "${{ needs.terraform.outputs.supabase_db_url }}"

